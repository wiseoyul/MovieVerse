
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieVerse - 영화 큐레이션</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>MovieVerse</h1>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="영화 제목을 검색하세요...">
    </div>
  </header>

  <main>
  <div id="movieGrid" class="movie-grid"></div>

  <div id="sentinel" class="sentinel">
    <div class="loader">로딩 중...</div>
  </div>
</main>

  <div id="movieModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close-btn">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
